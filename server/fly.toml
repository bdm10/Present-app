# Fly.io config for the Present backend. Run `fly launch --no-deploy --copy-config`
# from this folder, then see ../SETUP.md for secrets and the volume.
app = "present-yourname"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8787"

[mounts]
  source = "present_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # The daily scheduler runs inside this machine, so it must stay running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
