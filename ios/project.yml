name: Present

options:
  bundleIdPrefix: com.present
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here (or choose it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Present:
    type: application
    platform: iOS
    sources:
      - path: Present
        excludes:
          - "Resources/DemoSession"
          - "Resources/DemoSession/**"
      # Folder reference so the stems land at Present.app/DemoSession/…
      - path: Present/Resources/DemoSession
        type: folder
        buildPhase: resources
    info:
      path: Present/Info.plist
      properties:
        CFBundleDisplayName: Present
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.present.meditation.refresh
        NSFaceIDUsageDescription: Present uses Face ID to keep your private journal locked.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.present.meditation
        PRODUCT_NAME: Present
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Push notifications need a paid Apple Developer account. To enable them,
        # uncomment the next line (see ios/README.md → "Enable push notifications").
        # CODE_SIGN_ENTITLEMENTS: Present/Present.entitlements

  PresentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PresentTests
    dependencies:
      - target: Present
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.present.meditation.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Present.app/Present"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PresentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PresentUITests
    dependencies:
      - target: Present
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.present.meditation.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Present

schemes:
  Present:
    build:
      targets:
        Present: all
        PresentTests: [test]
        PresentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PresentTests
        - PresentUITests
    archive:
      config: Release
